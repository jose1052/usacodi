<form class="sesion" id="formulariosesion">
    <h2><strong>Inicio de Sesión</strong></h2>

        <div class="input-group">
            <h3>Ingrese su usuario</h3>

        </div>
        
        <div class="input-group">
            <h3>Ingrese su contraseña</h3>
            <input type="password" id="contrasena" placeholder="contraseña">
        </div>
    </div>
    
    <input type="button" class="btn-confirmar" value="Confirmar" onclick="verificar()">
</form>
